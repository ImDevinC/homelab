apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: changedetection
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Management
    gethomepage.dev/icon: changedetection.png
    gethomepage.dev/name: ChangeDetection
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - changedetection.int.imdevinc.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: changedetection
          port: 5000
