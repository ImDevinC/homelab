---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  labels:
    app: seerr
    app.kubernetes.io/name: seerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
      app.kubernetes.io/name: seerr
  template:
    metadata:
      labels:
        app: seerr
        app.kubernetes.io/name: seerr
    spec:
      initContainers:
        - name: config-seerr
          image: docker.io/busybox:stable
          command: ["/init-seerr/init-seerr.sh"]
          volumeMounts:
            - mountPath: /init-seerr
              name: init-files-seerr
            - name: mediaserver-volume
              mountPath: /seerr-config
              subPath: "config/seerr"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
      containers:
        - name: seerr
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
          image: "ghcr.io/seerr-team/seerr"
          imagePullPolicy: IfNotPresent
          readinessProbe:
            tcpSocket:
              port: 5055
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          ports:
            - name: seerr-port
              containerPort: 5055
              protocol: TCP
          volumeMounts:
            - name: mediaserver-volume
              mountPath: /app/config
              subPath: "config/seerr"
      volumes:
        - name: mediaserver-volume
          hostPath:
            path: /mnt/media
        - name: init-files-seerr
          configMap:
            defaultMode: 493
            name: init-seerr-cm
