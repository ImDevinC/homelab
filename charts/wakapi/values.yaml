replicaCount: 1
strategyType: Recreate

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  storageClass: hostpath-csi
  accessMode: ReadWriteOnce
  size: 2Gi

resources:
  requests:
    cpu: 10m
    memory: 128Mi

ingress:
  enabled: false

wakapi_config:
  env: production
  server:
    listen_ipv4: "0.0.0.0"
    listen_ipv6: ""
    listen_socket: ""
    listen_socket_mode: "0666"
    timeout_sec: 30
    port: 3000
    base_path: /
    public_url: https://wakapi.imdevinc.com
    tls_cert_path: ""
    tls_key_path: ""
  app:
    leaderboard_enabled: true
    leaderboard_scope: 7_days
    leaderboard_generation_time: "0 0 6 * * *,0 0 18 * * *"
    aggregation_time: "0 15 2 * * *"
    report_time_weekly: "0 0 18 * * 5"
    data_cleanup_time: "0 0 6 * * 0"
    inactive_days: 7
    import_enabled: true
    import_batch_size: 50
    import_backoff_min: 5
    import_max_rate: 24
    heartbeat_max_age: 4320h
    warm_caches: true
    avatar_url_template: api/avatar/{username_hash}.svg
    date_format: "Mon, 02 Jan 2006"
    datetime_format: "Mon, 02 Jan 2006 15:04"
    support_contact: ""
    data_retention_months: -1
    max_inactive_months: 12
  db:
    host: postgres-rw.postgres.svc.cluster.local
    port: "5432"
    socket: ""
    user: wakapi
    password: ""
    name: wakapi
    dialect: postgres
    charset: utf8mb4
    max_conn: 10
    ssl: false
  security:
    disable_local_auth: false
    password_salt: ""
    insecure_cookies: false
    cookie_max_age: 172800
    allow_signup: true
    signup_captcha: false
    invite_codes: true
    disable_frontpage: false
    expose_metrics: false
    trusted_header_auth: false
    trusted_header_auth_key: Remote-User
    trust_reverse_proxy_ips: ""
    signup_max_rate: 5/1h
    login_max_rate: 10/1m
    password_reset_max_rate: 5/1h
    oidc:
      name: Pocket ID
      client_id: ""
      client_secret: ""
      endpoint: https://login.int.imdevinc.com/.well-known/openid-configuration
  mail:
    enabled: false
    sender: "Wakapi <noreply@imdevinc.com>"
    provider: smtp
    smtp:
      host: ""
      port: ""
      username: ""
      password: ""
      tls: true
      skip_verify: false
  sentry:
    dsn: ""
    environment: production
    enable_tracing: false
    sample_rate: 0.75
    sample_rate_heartbeats: 0.1
  quick_start: false
  enable_pprof: false
