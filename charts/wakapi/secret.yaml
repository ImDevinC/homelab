apiVersion: v1
kind: Secret
metadata:
  name: wakapi-secrets
  namespace: wakapi
type: Opaque
stringData:
  # Dummy values for initial deployment. Replace with real credentials via SealedSecret.
  WAKAPI_DB_PASSWORD: REPLACE_WITH_WAKAPI_DATABASE_PASSWORD
  WAKAPI_PASSWORD_SALT: REPLACE_WITH_RANDOM_PASSWORD_SALT
  WAKAPI_OIDC_PROVIDERS_0_CLIENT_ID: REPLACE_WITH_POCKET_ID_CLIENT_ID
  WAKAPI_OIDC_PROVIDERS_0_CLIENT_SECRET: REPLACE_WITH_POCKET_ID_CLIENT_SECRET
  WAKAPI_MAIL_SMTP_USERNAME: REPLACE_WITH_SMTP_USERNAME
  WAKAPI_MAIL_SMTP_PASSWORD: REPLACE_WITH_SMTP_PASSWORD
