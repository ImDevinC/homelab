apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wakapi
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Homelab
    gethomepage.dev/icon: wakapi.png
    gethomepage.dev/name: Wakapi
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - wakapi.int.imdevinc.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: wakapi
          namespace: wakapi
          port: 80
