apiVersion: v1
kind: Service
metadata:
  name: wakapi
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Homelab
    gethomepage.dev/icon: wakapi.png
    gethomepage.dev/name: Wakapi
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: wakapi
    app.kubernetes.io/instance: wakapi
