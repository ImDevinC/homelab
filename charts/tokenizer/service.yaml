apiVersion: v1
kind: Service
metadata:
  labels:
    service: tokenizer
  name: tokenizer
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    service: tokenizer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: tokenizer
    service: tokenizer
  name: tokenizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tokenizer
      service: tokenizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tokenizer
        service: tokenizer
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: tokenizer
          image: ghcr.io/imdevinc/tokenizer
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
          securityContext:
            runAsUser: 101
            runAsGroup: 101
      restartPolicy: Always
