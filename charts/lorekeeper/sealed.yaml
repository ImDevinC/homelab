---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lorekeeper-secret
  namespace: lorekeeper
spec:
  encryptedData:
    EMBEDDING_API_KEY: 
    LLM_API_KEY: 
    LOREKEEPER_ADMIN_TOKEN: 
    LOREKEEPER_CHAT_TOKEN: 
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: lorekeeper-secret
      namespace: lorekeeper
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: discord-secret
  namespace: lorekeeper
spec:
  encryptedData:
    DISCORD_BOT_TOKEN: 
    LOREKEEPER_CHAT_TOKEN: 
  template:
    metadata:
      name: discord-secret
      namespace: lorekeeper
    type: Opaque
