apiVersion: v1
kind: ConfigMap
metadata:
  name: lorekeeper-config
  namespace: lorekeeper
data:
  # --- PostgreSQL ---
  POSTGRES_HOST: "postgres-rw.postgres.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "lorekeeper"
  POSTGRES_DB: "lorekeeper"

  # --- Qdrant ---
  QDRANT_URL: "http://qdrant.qdrant.svc.cluster.local:6333"

  # --- Storage (local backend for K8s PVC) ---
  STORAGE_BACKEND: "local"
  STORAGE_LOCAL_PATH: "/data/documents"

  # --- LLM ---
  LLM_BASE_URL: "https://openrouter.ai/api/v1"
  LLM_MODEL: "deepseek/deepseek-v4-flash"
  ENTITY_EXTRACTION_MODEL: "deepseek/deepseek-v4-flash"

  # --- Embeddings ---
  EMBEDDING_BASE_URL: "https://openrouter.ai/api/v1"
  EMBEDDING_MODEL: "openai/text-embedding-3-small"
  EMBEDDING_DIMENSIONS: "1536"

  # --- Server ---
  LOREKEEPER_PORT: "8080"
  LOREKEEPER_BASE_URL: "http://lorekeeper.lorekeeper.svc.cluster.local:8080"
  LOREKEEPER_DEFAULT_CAMPAIGN_SLUG: "thf"
  LOREKEEPER_CORS_ORIGINS: ""
  LOREKEEPER_MAX_UPLOAD_MB: "20"

  # --- Chunking ---
  CHUNK_TARGET_TOKENS: "500"
  CHUNK_OVERLAP_TOKENS: "75"
  CHUNK_CHILD_TARGET_TOKENS: "200"
  CHUNK_CHILD_OVERLAP_TOKENS: "50"

  # --- Retrieval ---
  RETRIEVAL_MIN_SCORE: "0.18"

  # --- Logging ---
  LOG_LEVEL: "info"

  # --- Redis (for rate limiting) ---
  REDIS_URL: "redis://redis-master.redis.svc.cluster.local:6379"

  # --- Rate Limiting ---
  RATE_LIMIT_MAX_TOKENS: "50000"
  RATE_LIMIT_WINDOW_SECONDS: "60"
