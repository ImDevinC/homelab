apiVersion: v1
kind: ConfigMap
metadata:
  name: lorekeeper-config
  namespace: lorekeeper
data:
  # --- PostgreSQL ---
  POSTGRES_HOST: "postgres-rw.postgres.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "lorekeeper"
  POSTGRES_DB: "lorekeeper"

  # --- LLM ---
  LLM_BASE_URL: "https://openrouter.ai/api/v1"
  LLM_MODEL: "deepseek/deepseek-v4-flash"
  TITLE_MODEL: "deepseek/deepseek-v4-flash"
  TITLE_MAX_TOKENS: "200"

  # --- Server ---
  LOREKEEPER_PORT: "8080"
  LOREKEEPER_BASE_URL: "http://lorekeeper.lorekeeper.svc.cluster.local:8080"
  LOREKEEPER_DEFAULT_CAMPAIGN_SLUG: "thf"
  LOREKEEPER_CORS_ORIGINS: ""
  LOREKEEPER_MAX_UPLOAD_MB: "20"
  LOREKEEPER_REQUEST_TIMEOUT: "0"

  # --- Logging ---
  LOG_LEVEL: "info"

  # --- Redis (for rate limiting) ---
  REDIS_URL: "redis://redis-master.redis.svc.cluster.local:6379"

  # --- Rate Limiting ---
  RATE_LIMIT_MAX_TOKENS: "50000"
  RATE_LIMIT_WINDOW_SECONDS: "60"
