apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: librechat_rag
spec:
  name: librechat_rag
  owner: librechat_rag
  cluster:
    name: postgres
  extensions:
    - name: vector
      ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: librechat_rag
spec:
  cluster:
    name: postgres
  name: librechat_rag
  login: true
  superuser: false
  databaseRoleReclaimPolicy: delete
  passwordSecret:
    name: librechat-rag-database-password
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: librechat-rag-database-password
  namespace: postgres
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      labels:
        cnpg.io/reload: "true"
      name: librechat-rag-database-password
      namespace: postgres
    type: kubernetes.io/basic-auth