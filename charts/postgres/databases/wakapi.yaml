apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: wakapi
spec:
  name: wakapi
  owner: wakapi
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: wakapi
spec:
  cluster:
    name: postgres
  name: wakapi
  login: true
  superuser: false
  databaseRoleReclaimPolicy: delete
  passwordSecret:
    name: wakapi-database-password
---
apiVersion: v1
kind: Secret
metadata:
  name: wakapi-database-password
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  # Dummy values for initial deployment. Keep this password in sync with wakapi/secret.yaml.
  username: wakapi
  password: REPLACE_WITH_WAKAPI_DATABASE_PASSWORD
