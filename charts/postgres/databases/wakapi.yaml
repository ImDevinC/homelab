apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: wakapi
spec:
  name: wakapi
  owner: wakapi
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: wakapi
spec:
  cluster:
    name: postgres
  name: wakapi
  login: true
  databaseRoleReclaimPolicy: delete
  passwordSecret:
    name: wakapi-database-password
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wakapi-database-password
  namespace: postgres
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: wakapi-database-password
      namespace: postgres
