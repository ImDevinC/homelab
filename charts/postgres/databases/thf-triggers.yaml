apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: thf-triggers
spec:
  name: thf-triggers
  owner: thf-triggers
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: thf-triggers
spec:
  cluster:
    name: postgres
  name: thf-triggers
  login: true
  databaseRoleReclaimPolicy: delete
  passwordSecret:
    name: thf-triggers-database-password
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: thf-triggers-database-password
  namespace: postgres
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: thf-triggers-database-password
      namespace: postgres
