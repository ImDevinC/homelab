apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: awaybound
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  cluster:
    name: postgres
  name: awaybound
  login: true
  superuser: false
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: awaybound-database-password
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: awaybound
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  name: awaybound
  owner: awaybound
  databaseReclaimPolicy: retain
  cluster:
    name: postgres
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: awaybound-database-password
  namespace: postgres
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: awaybound-database-password
      namespace: postgres
