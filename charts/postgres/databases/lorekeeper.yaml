apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: lorekeeper
spec:
  name: lorekeeper
  owner: lorekeeper
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: lorekeeper
spec:
  cluster:
    name: postgres
  name: lorekeeper
  login: true
  superuser: false
  databaseRoleReclaimPolicy: delete
  passwordSecret:
    name: lorekeeper-database-password
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lorekeeper-database-password
  namespace: postgres
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: lorekeeper-database-password
      namespace: postgres
