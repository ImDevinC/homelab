apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: readr
  namespace: readr
spec:
  hostnames:
    - readr.int.imdevinc.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: readr
          namespace: readr
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
