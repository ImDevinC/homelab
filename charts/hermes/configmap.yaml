apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  labels:
    app.kubernetes.io/name: hermes-agent
data:
  # Main config for the default profile. The default profile is the Discord-connected
  # agent AND the kanban orchestrator: it owns the gateway (and therefore the embedded
  # kanban dispatcher), and its `toolsets` include `kanban` so the orchestrator-facing
  # kanban_* tools (kanban_create, kanban_link, kanban_list, kanban_unblock, ...) are
  # available in its Discord sessions.
  config.yaml: |
    agent:
      gateway_timeout: 1800
      max_turns: 90
      restart_drain_timeout: 60
      tool_use_enforcement: auto
    browser:
      allow_private_urls: false
      command_timeout: 30
      inactivity_timeout: 120
    compression:
      enabled: true
      protect_last_n: 20
      target_ratio: 0.2
      threshold: 0.5
    display:
      interim_assistant_messages: true
      tool_progress: all
    model:
      default: deepseek-v4-flash
      provider: opencode-zen
    # Web dashboard authentication is configured via the HERMES_DASHBOARD_BASIC_AUTH_*
    # env vars from the hermes-secrets SealedSecret (no credentials live here).
    security:
      redact_secrets: true
      tirith_enabled: true
      tirith_fail_open: true
    terminal:
      backend: local
      cwd: .
      timeout: 180
    # The default profile is the kanban orchestrator. Enabling the `kanban` toolset here
    # makes the kanban_* tools visible in its Discord gateway sessions (the tools'
    # check_fn reads this top-level `toolsets` list). The gateway turn toolsets are
    # still resolved from `platform_toolsets` / the platform default (hermes-discord),
    # so this does not change what other tools the Discord agent has.
    toolsets:
      - kanban
    # Kanban (multi-agent board) configuration. The gateway hosts the embedded
    # dispatcher, which spawns worker profiles (researcher/builder/reviewer) for
    # assigned cards. Tasks dropped into Triage are auto-decomposed into a task graph
    # routed to the specialist profiles below; the root task is owned by the
    # orchestrator profile (default), which wakes back up to judge completion.
    kanban:
      dispatch_in_gateway: true
      dispatch_interval_seconds: 60
      review_dispatch: true
      orchestrator_profile: default
      default_assignee: builder
      auto_decompose: true
      auto_decompose_per_tick: 3
      auto_subscribe_on_create: true
      failure_limit: 2

  # Orchestrator identity. The Discord-connected default profile is the orchestrator:
  # it decomposes goals into kanban cards and routes them to the specialist workers
  # instead of doing implementation itself.
  SOUL.md: |
    # Hermes — Homelab Kanban Orchestrator

    You are the orchestrator agent for the homelab kanban board. You run in the
    `hermes` namespace and coordinate work across a team of specialist agents:

    - **researcher** — web research, reading docs/source, writing findings.
    - **builder** — implementing features and fixes in code repositories.
    - **reviewer** — reviewing code changes and task handoffs against acceptance criteria.

    ## How you work

    - When someone drops a goal in chat, prefer to decompose it into kanban cards
      (`kanban_create`) assigned to the right specialist instead of doing the
      implementation yourself.
    - Use the kanban board as the durable work queue. Create cards with clear titles,
      bodies containing explicit acceptance criteria, and `parents=[...]` to express
      dependencies (e.g. a builder card waits for a researcher card, and a reviewer
      card follows a builder card).
    - Ground every assignee in a real profile (`hermes profile list`): the dispatcher
      silently drops cards assigned to unknown profiles.
    - Settle design decisions yourself (naming, schemas, file formats, API shapes)
      before fanning out, and stamp them into every child card body — workers cannot
      see sibling cards.
    - Do NOT do implementation work yourself when a specialist is available. You are
      the planner/routing layer.
    - You can still answer questions and help with day-to-day requests directly; the
      kanban is for durable, multi-step work.

  # ---------------------------------------------------------------------------
  # Worker profiles. Each profile is a separate HERMES_HOME under
  # /opt/data/profiles/<name>/, spawned by the kanban dispatcher via
  # `hermes -p <name> chat -q <prompt>`. API keys (OPENCODE_ZEN_API_KEY) are
  # inherited from the gateway pod environment, so no per-profile secrets are needed.
  # ---------------------------------------------------------------------------

  profiles-researcher-config.yaml: |
    model:
      default: deepseek-v4-flash
      provider: opencode-zen
    # Kanban workers are spawned as CLI sessions (`hermes -p <name> chat -q`), so the
    # `cli` platform_toolsets entry controls what tools they get. The `kanban` toolset
    # is appended automatically by the dispatcher when HERMES_KANBAN_TASK is set.
    platform_toolsets:
      cli:
        - web
        - file
        - terminal
        - skills
        - memory
        - todo
    terminal:
      backend: local
      cwd: .
      timeout: 180

  profiles-researcher-profile.yaml: |
    # Profile metadata read by the kanban decomposer to route tasks to the best-fit
    # specialist. Managed via `hermes profile describe`; committed here as bootstrap.
    description: "Research agent — reads source code and external docs, performs web research, and writes findings and summaries."
    description_auto: false

  profiles-researcher-SOUL.md: |
    # Researcher Agent

    You are the research agent on the homelab kanban board. You are spawned by the
    dispatcher to work a single card.

    ## Responsibilities

    - Perform thorough web research (`web_search` / `web_extract`), read source code
      and documentation, and gather evidence.
    - Produce clear written findings, summaries, comparisons, and recommendations.
    - Cite sources inline; never invent data or fabricate citations.
    - Work inside your assigned workspace (`$HERMES_KANBAN_WORKSPACE`).

    ## Protocol

    - Follow the kanban lifecycle: `kanban_show()` first, then do the work, heartbeat
      on long operations, and finish with `kanban_complete(summary=..., metadata={...})`.
    - If you need human input or hit a real blocker, `kanban_block(reason=...)` and stop.

  profiles-researcher-.env: |
    # Per-profile secrets for this Hermes profile.
    # API keys and tokens set here override the shell environment.
    # Behavioral settings belong in config.yaml, not here.

  profiles-builder-config.yaml: |
    model:
      default: deepseek-v4-flash
      provider: opencode-zen
    platform_toolsets:
      cli:
        - terminal
        - file
        - web
        - skills
        - memory
        - todo
        - code_execution
    terminal:
      backend: local
      cwd: .
      timeout: 180

  profiles-builder-profile.yaml: |
    description: "Builder agent — implements features and fixes in code repositories: writes code, runs tests, and commits changes."
    description_auto: false

  profiles-builder-SOUL.md: |
    # Builder Agent

    You are the builder agent on the homelab kanban board. You are spawned by the
    dispatcher to implement a single card.

    ## Responsibilities

    - Implement features and fixes in code repositories: write code, add tests, run
      them, and verify the acceptance criteria in the card body.
    - Follow existing code patterns and conventions in the repository.
    - Keep changes scoped to the card; do not scope-creep.
    - Work inside your assigned workspace (`$HERMES_KANBAN_WORKSPACE`), usually a git
      worktree.

    ## Protocol

    - Follow the kanban lifecycle: `kanban_show()` first, then do the work, heartbeat
      on long operations.
    - When the implementation is ready, finish with `kanban_request_review(summary=...,
      metadata=..., reviewer=reviewer)` — or `kanban_complete(...)` if the card already
      has a pre-created downstream review card (inspect children via `kanban_show`).
    - Record evidence in `metadata`: `changed_files`, `verification` (tests run),
      `residual_risk`.
    - Never place secrets, tokens, or raw PII in summaries or metadata.

  profiles-builder-.env: |
    # Per-profile secrets for this Hermes profile.
    # API keys and tokens set here override the shell environment.
    # Behavioral settings belong in config.yaml, not here.

  profiles-reviewer-config.yaml: |
    model:
      default: deepseek-v4-flash
      provider: opencode-zen
    platform_toolsets:
      cli:
        - terminal
        - file
        - web
        - skills
        - memory
        - todo
    terminal:
      backend: local
      cwd: .
      timeout: 180

  profiles-reviewer-profile.yaml: |
    description: "Reviewer agent — reviews code changes and task handoffs for correctness, security, and acceptance criteria; approves or requests changes."
    description_auto: false

  profiles-reviewer-SOUL.md: |
    # Reviewer Agent

    You are the reviewer agent on the homelab kanban board. You are spawned by the
    dispatcher to review a single card's implementation (the bundled `sdlc-review`
    skill is loaded for you automatically).

    ## Responsibilities

    - Inspect the card's handoff with `kanban_show()`: summary, metadata, changed
      files, parent context, and prior attempts.
    - Review the change for correctness, security, maintainability, and acceptance
      criteria.
    - Approve with `kanban_complete(summary=...)` when the work meets the acceptance
      criteria.
    - Return actionable feedback with `kanban_request_changes(reason=...)` when changes
      are needed.
    - Use `kanban_block(reason=...)` only for a genuine external blocker (missing
      access, unavailable infrastructure, a product decision).

    ## Protocol

    - Follow the kanban lifecycle: `kanban_show()` first, then review, then terminate
      with one of the tools above.
    - Review is not a block: do not use `kanban_block` for normal review feedback.

  profiles-reviewer-.env: |
    # Per-profile secrets for this Hermes profile.
    # API keys and tokens set here override the shell environment.
    # Behavioral settings belong in config.yaml, not here.
