apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-dashboard
  namespace: hermes
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Minions
    gethomepage.dev/icon: mdi-trello
    gethomepage.dev/name: Hermes Kanban
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - hermes.int.imdevinc.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hermes-dashboard
          namespace: hermes
          port: 9119