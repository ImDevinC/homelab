apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-config
          image: "nousresearch/hermes-agent"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              mkdir -p "/opt/data/home"
              if [ -f "/bootstrap/config.yaml" ]; then
                if [ "true" = "true" ] || [ ! -f "/opt/data/config.yaml" ]; then
                  cp "/bootstrap/config.yaml" "/opt/data/config.yaml"
                fi
              fi
              if [ -f "/bootstrap/SOUL.md" ]; then
                if [ "true" = "true" ] || [ ! -f "/opt/data/SOUL.md" ]; then
                  cp "/bootstrap/SOUL.md" "/opt/data/SOUL.md"
                fi
              fi
                # Bootstrap the kanban worker profiles (researcher, builder, reviewer).
                # Each profile is a separate HERMES_HOME under /opt/data/profiles/<name>/;
                # the dispatcher spawns them with `hermes -p <name> chat -q <prompt>`.
                # ConfigMap keys cannot contain '/', so the bootstrap files are
                # mounted as flattened names (profiles-<name>-<file>).
                for p in researcher builder reviewer; do
                  profile_dir="/opt/data/profiles/$p"
                  mkdir -p "$profile_dir"
                  # Standard profile subdirectories (mirrors `hermes profile create`).
                  for sub in memories sessions skills skins logs plans workspace cron home; do
                    mkdir -p "$profile_dir/$sub"
                  done
                  for f in config.yaml SOUL.md profile.yaml .env; do
                    if [ -f "/bootstrap/profiles-$p-$f" ]; then
                      cp "/bootstrap/profiles-$p-$f" "$profile_dir/$f"
                    fi
                  done
                # Seed bundled skills (including the sdlc-review skill the kanban
                # dispatcher force-loads for review tasks). Same sync the image's
                # stage2 hook runs for the default profile.
                if [ -d "/opt/hermes/skills" ]; then
                  HERMES_HOME="$profile_dir" /opt/hermes/.venv/bin/python -c \
                    "from tools.skills_sync import sync_skills; sync_skills(quiet=True)" \
                    || echo "Warning: skills sync failed for profile $p; continuing"
                fi
              done
          env:
            - name: HERMES_HOME
              value: "/opt/data"
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: hermes-agent
          image: "nousresearch/hermes-agent"
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - run
          workingDir: /opt/hermes
          env:
            - name: HERMES_HOME
              value: "/opt/data"
            - name: HOME
              value: "/opt/data/home"
            - name: HERMES_HUMAN_DELAY_MAX_MS
              value: "2500"
            - name: HERMES_HUMAN_DELAY_MIN_MS
              value: "800"
            - name: HERMES_HUMAN_DELAY_MODE
              value: "off"
            - name: IMAGE_TOOLS_DEBUG
              value: "false"
            - name: MOA_TOOLS_DEBUG
              value: "false"
            - name: VISION_TOOLS_DEBUG
              value: "false"
            - name: WEB_TOOLS_DEBUG
              value: "false"
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
          envFrom:
            - secretRef:
                name: hermes-secrets
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
        # The Hermes web dashboard serves the kanban board (and the rest of the
        # management UI) on port 9119. It shares the same HERMES_HOME (/opt/data)
        # as the gateway, so it reads/writes the same config.yaml and the same
        # per-board SQLite DB (~/.hermes/kanban.db) as the embedded dispatcher.
        # Bound to 0.0.0.0 so Traefik can reach it; the non-loopback bind engages
        # the dashboard auth gate, which is satisfied by the `dashboard.basic_auth`
        # block in config.yaml (committed as a scrypt password hash, no plaintext).
        - name: hermes-dashboard
          image: "nousresearch/hermes-agent"
          imagePullPolicy: IfNotPresent
          args:
            - dashboard
            - --host
            - 0.0.0.0
            - --port
            - "9119"
            - --no-open
            # The image ships the prebuilt web UI (hermes_cli/web_dist); skip
            # the runtime npm build so the sidecar starts fast without node.
            - --skip-build
          workingDir: /opt/hermes
          env:
            - name: HERMES_HOME
              value: "/opt/data"
            - name: HOME
              value: "/opt/data/home"
          envFrom:
            - secretRef:
                name: hermes-secrets
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: bootstrap
          configMap:
            name: hermes-agent-config
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "1Gi"
      terminationGracePeriodSeconds: 120
