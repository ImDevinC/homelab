apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes-agent
          image: "nousresearch/hermes-agent"
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - run
          workingDir: /opt/hermes
          env:
            - name: HERMES_HOME
              value: "/opt/data"
            - name: HOME
              value: "/opt/data/home"
            - name: HERMES_HUMAN_DELAY_MAX_MS
              value: "2500"
            - name: HERMES_HUMAN_DELAY_MIN_MS
              value: "800"
            - name: HERMES_HUMAN_DELAY_MODE
              value: "off"
            - name: IMAGE_TOOLS_DEBUG
              value: "false"
            - name: MOA_TOOLS_DEBUG
              value: "false"
            - name: VISION_TOOLS_DEBUG
              value: "false"
            - name: WEB_TOOLS_DEBUG
              value: "false"
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
            # Run the web dashboard as a supervised s6 service in this same
            # container (the documented HERMES_DASHBOARD=1 pattern) instead of a
            # separate sidecar container. The dashboard binds 0.0.0.0:9119 so
            # Traefik can reach it via the hermes-dashboard Service; the
            # non-loopback bind engages the auth gate, satisfied by the
            # HERMES_DASHBOARD_BASIC_AUTH_* vars from the hermes-secrets secret.
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
          envFrom:
            - secretRef:
                name: hermes-secrets
          resources:
            limits:
              cpu: "2"
              memory: 5Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "1Gi"
      terminationGracePeriodSeconds: 120
