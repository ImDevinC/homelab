apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gift-tracker
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Homelab
    gethomepage.dev/icon: mdi-gift-outline
    gethomepage.dev/name: Gifts
spec:
  hostnames:
    - gifts.int.imdevinc.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
